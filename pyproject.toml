[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "space-segment-builder"
version = "0.1.0"
description = "Space Segment Builder — Educational software for satellite mission design"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.6",
    "numpy>=1.26",
    "scipy>=1.12",
    "matplotlib>=3.8",
    "python-docx>=1.1",
    "pyqtgraph>=0.13",
    "PySide6>=6.6",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "hypothesis>=6.98",
    "ruff>=0.3",
    "mypy>=1.9",
    "pyinstaller>=6.5",
]

[project.scripts]
ssb-student = "ssb.student_app.main:main"
ssb-teacher = "ssb.teacher_app.main:main"
ssb-cli = "ssb.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
